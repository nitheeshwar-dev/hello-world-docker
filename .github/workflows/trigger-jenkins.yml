name: Trigger Jenkins Deploy

on:
  push:
    branches:
      - main

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins pipeline
        run: |
          curl -sf -X POST "${JENKINS_URL}/job/${JENKINS_JOB_NAME}/buildWithParameters" \
            --data-urlencode "token=${JENKINS_TRIGGER_TOKEN}" \
            --data-urlencode "GIT_REPO_URL=https://github.com/${{ github.repository }}.git" \
            --data-urlencode "GIT_BRANCH=main" \
            --data-urlencode "DOMAIN=app1.evolvra.online" \
            --data-urlencode "APP_NAME=app1"
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB_NAME: ${{ secrets.JENKINS_JOB_NAME }}
          JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}
